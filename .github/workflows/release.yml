name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release for latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "latest tag: ${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping."
            exit 0
          fi

          notes="$(jq -r '.change_log' version.json)"
          gh release create "${tag}" "kcptun.sh#kcptun.sh" \
            --title "kcptun-script ${tag}" \
            --notes "${notes}"
