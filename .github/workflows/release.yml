name: Release

on:
  push:
    branches:
      - main
    # 也要监听 tag 推送：作业体是按 `git describe --tags` 取最新 tag 来发布的，
    # 只订阅分支时，“先推分支、后打 tag”这种顺序会让那次 run 只看到上一个 tag，
    # 发现 Release 已存在直接 skip，新版本的 Release 就静默缺失（实测踩过）。
    # 加上 tags 触发后，推送 tag 自己就能把对应 Release 补上，与推送顺序无关。
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release for latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "latest tag: ${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping."
            exit 0
          fi

          notes="$(jq -r '.change_log' version.json)"
          gh release create "${tag}" "kcptun.sh#kcptun.sh" \
            --title "kcptun-script ${tag}" \
            --notes "${notes}"
